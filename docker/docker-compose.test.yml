# Veltrix integration test matrix.
# Start: docker compose -f docker/docker-compose.test.yml up -d
# Stop:  docker compose -f docker/docker-compose.test.yml down
# Known creds are intentionally weak and local only. Authorized lab use only.

services:
  ssh-server:
    build:
      context: ./ssh
      dockerfile: Dockerfile
    ports:
      - "2222:22"
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      veltrix-net:
        ipv4_address: 10.10.0.10

  ftp-server:
    build:
      context: ./ftp
      dockerfile: Dockerfile
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 21 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      veltrix-net:
        ipv4_address: 10.10.0.11

  mysql-server:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    restart: "no"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utestuser", "-ptestpass"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      veltrix-net:
        ipv4_address: 10.10.0.12

  telnet-server:
    image: amouat/telnetd
    ports:
      - "2323:23"
    restart: "no"
    networks:
      veltrix-net:
        ipv4_address: 10.10.0.13

  smtp-server:
    image: namshi/smtp
    ports:
      - "2525:25"
    restart: "no"
    networks:
      veltrix-net:
        ipv4_address: 10.10.0.14

  http-server:
    image: nginx:alpine
    ports:
      - "8080:80"
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      veltrix-net:
        ipv4_address: 10.10.0.15

networks:
  veltrix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16
