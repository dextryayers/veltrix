name: Veltrix CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'config/**'
      - 'rules/**'
      - 'docker/**'
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint with clippy
        run: cargo clippy -- -D warnings
      - name: Security audit
        run: |
          cargo install cargo-audit 2>/dev/null || true
          cargo audit --ignore RUSTSEC-2024-0001 2>/dev/null || echo "Audit skipped"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Unit tests
        run: cargo test --lib
      - name: Build release
        run: cargo build --release
      - name: Verify binary
        run: ./target/release/veltrix --version

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Start test containers
        run: |
          docker compose -f docker/docker-compose.test.yml up -d
          sleep 10
      - name: Run integration tests
        run: cargo test --test integration -- --test-threads=1
      - name: Cleanup
        run: docker compose -f docker/docker-compose.test.yml down

  build-release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/veltrix
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-linux-amd64
          path: target/x86_64-unknown-linux-gnu/release/veltrix
